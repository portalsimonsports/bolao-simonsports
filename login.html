<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Entrar | Plataforma de Bolões</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<style>
  :root{
    --bg:#0f172a; --card:#0b1222; --fg:#e5e7eb; --muted:#8b98b8;
    --brand:#10b981; --danger:#ef4444; --accent:#38bdf8;
  }
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial}
  body{margin:0;background:var(--bg);color:var(--fg);display:grid;place-items:center;min-height:100vh}
  .wrap{width:min(920px,94vw);padding:24px}
  .card{background:var(--card);border-radius:16px;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  h1{margin:0 0 4px;font-size:1.5rem}
  p.muted{margin:.25rem 0 1rem;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1 1 260px}
  label{display:block;margin:.5rem 0 .25rem;color:var(--muted);font-size:.9rem}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #1f2a44;background:#0a1328;color:#dbe2f7}
  input:focus{outline:none;border-color:var(--accent)}
  button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:600}
  .btn{background:var(--brand);color:#052e2b}
  .btn:hover{filter:brightness(1.05)}
  .btn-ghost{background:#0a1328;color:#cfe3ff;border:1px solid #1f2a44}
  .btn-google{background:#ffffff;color:#111827}
  .stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .line{height:1px;background:#1f2a44;margin:14px 0}
  .status{margin-top:10px;font-size:.95rem}
  .ok{color:var(--brand)} .err{color:var(--danger)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .pill{padding:6px 10px;border-radius:999px;background:#0a1328;border:1px solid #1f2a44;color:#a7b4d6;font-size:.85rem}
  .hidden{display:none!important}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1>Entrar na plataforma</h1>
      <span id="who" class="pill">desconectado</span>
    </div>

    <div class="card">
      <p class="muted">Use sua conta Google para entrar. Seu cadastro será criado automaticamente no Firebase do Bolão Esportivo.</p>

      <div class="row">
        <div class="col">
          <button id="btnGoogle" class="btn-google">Continuar com Google</button>
        </div>

        <!-- Login por e-mail/senha mantido oculto por padrão.
             Para usar, ative Email/Senha no Firebase Authentication e remova a classe hidden abaixo. -->
        <div id="emailBox" class="col hidden">
          <div class="stack">
            <label for="email">E-mail</label>
            <input id="email" type="email" placeholder="voce@email.com">
            <label for="pass">Senha</label>
            <input id="pass" type="password" placeholder="••••••••">
            <div class="row">
              <button id="btnSignIn" class="btn" style="flex:1">Entrar</button>
              <button id="btnSignUp" class="btn-ghost" style="flex:1">Criar conta</button>
            </div>
          </div>
        </div>
      </div>

      <div class="line"></div>

      <div class="row">
        <button id="btnLogout" class="btn-ghost">Sair</button>
        <button id="btnBolao" class="btn" style="display:none">Ir para o Bolão</button>
        <span id="msg" class="status"></span>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    /******************** CONFIG FIREBASE NOVO ********************/
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyA8tO_E2s6R9bYnEW6_5skqCUrBSVLLKkw",
      authDomain: "pss-bolao-esportivo.firebaseapp.com",
      projectId: "pss-bolao-esportivo",
      storageBucket: "pss-bolao-esportivo.firebasestorage.app",
      messagingSenderId: "575209475526",
      appId: "1:575209475526:web:7d2d1efa2d9fd8b600f6c7"
    };

    // Mantido apenas por compatibilidade com a estrutura antiga do site.
    // Se a action signup não existir ou falhar, o login no Firebase continuará funcionando.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxbFTg0YODAo1oSX6OQe4HPbMnkrMsXQP93oJsTj4ilhA2fTiZgxk-4qKv1XPiNyyaC/exec";
    const GAS_SYNC_ATIVO = true;
    /**************************************************************/

    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const el = id => document.getElementById(id);
    const show = (txt, cls) => {
      const m = el('msg');
      m.className = 'status ' + (cls || '');
      m.textContent = txt;
    };

    function nomeUsuario(user){
      return user.displayName || (user.email ? user.email.split('@')[0] : 'Participante');
    }

    async function garantirUsuarioFirestore(user){
      const uid = user.uid;
      const nome = nomeUsuario(user);
      const email = user.email || '';
      const foto = user.photoURL || '';

      const ref = db.collection('usuarios').doc(uid);
      const snap = await ref.get();

      const base = {
        uid: uid,
        nome: nome,
        email: email,
        foto: foto,
        ativo: true,
        status: 'ATIVO',
        perfilGlobal: 'USUARIO',
        ultimoLoginEm: firebase.firestore.FieldValue.serverTimestamp()
      };

      if(!snap.exists){
        base.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
      }

      await ref.set(base, { merge: true });

      localStorage.setItem('uid', uid);
      localStorage.setItem('nome', nome);
      localStorage.setItem('email', email);
      localStorage.setItem('foto', foto);
    }

    async function syncWithGAS(user){
      if(!GAS_SYNC_ATIVO || !GAS_URL) return;

      try{
        const uid = user.uid;
        const name = nomeUsuario(user);

        await fetch(GAS_URL + '?action=signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid, name })
        });
      }catch(err){
        console.warn('Aviso: GAS signup não sincronizado:', err);
      }
    }

    async function processarLogin(user){
      const nome = nomeUsuario(user);
      await garantirUsuarioFirestore(user);
      await syncWithGAS(user);

      el('who').textContent = nome + ' (' + user.uid.slice(0,6) + '…)';
      el('btnGoogle').style.display = 'none';
      el('btnLogout').style.display = 'inline-block';
      el('btnBolao').style.display = 'inline-block';
      show('Login OK. Cadastro automático ativo ✅', 'ok');
    }

    auth.onAuthStateChanged(async user => {
      if(user){
        try{
          await processarLogin(user);
        }catch(err){
          console.error(err);
          show('Login feito, mas houve erro ao criar cadastro: ' + err.message, 'err');
        }
      }else{
        el('who').textContent = 'desconectado';
        el('btnGoogle').style.display = 'inline-block';
        el('btnLogout').style.display = 'inline-block';
        el('btnBolao').style.display = 'none';
        localStorage.removeItem('uid');
        localStorage.removeItem('nome');
        localStorage.removeItem('email');
        localStorage.removeItem('foto');
        show('Sessão encerrada', '');
      }
    });

    el('btnGoogle').onclick = async () => {
      try{
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
      }catch(err){
        show('Google login falhou: ' + err.message, 'err');
      }
    };

    el('btnSignIn').onclick = async () => {
      try{
        const email = el('email').value.trim();
        const pass = el('pass').value;
        await auth.signInWithEmailAndPassword(email, pass);
      }catch(err){
        show('Erro ao entrar: ' + err.message, 'err');
      }
    };

    el('btnSignUp').onclick = async () => {
      try{
        const email = el('email').value.trim();
        const pass = el('pass').value;
        await auth.createUserWithEmailAndPassword(email, pass);
        show('Conta criada. Você já está logado.', 'ok');
      }catch(err){
        show('Erro ao criar conta: ' + err.message, 'err');
      }
    };

    el('btnLogout').onclick = async () => {
      try{
        await auth.signOut();
      }catch(err){
        show('Erro ao sair: ' + err.message, 'err');
      }
    };

    el('btnBolao').onclick = () => {
      window.location.href = 'bolao.html';
    };
  </script>
</body>
</html>
