name: Atualizar bolao.html

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-desafiante-palpite-automatico.yml'
      - '.github/scripts/corrigir_bolao_ia.py'
  pull_request:
    paths:
      - '.github/scripts/corrigir_bolao_ia.py'

permissions:
  contents: write

jobs:
  atualizar-bolao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Aplicar ajuste pontual no bolao.html
        run: python3 .github/scripts/corrigir_bolao_ia.py

      - name: Validar estrutura preservada
        run: |
          grep -q '<!DOCTYPE html>' bolao.html
          grep -q 'function ensureUser' bolao.html
          grep -q 'function detalhePontuacao' bolao.html
          grep -q 'function teamMiniHtml' bolao.html
          grep -q 'V062_RODADA_ATUAL_PROXIMOS_INSTANTANEOS' bolao.html

      - name: Publicar bolao.html atualizado
        run: |
          if git diff --quiet -- bolao.html; then
            echo 'O bolao.html já está atualizado.'
            exit 0
          fi
          git config user.name 'Portal SimonSports Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bolao.html
          git commit -m 'Corrigir rodada atual e próximos jogos do bolão'
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${BRANCH}"
