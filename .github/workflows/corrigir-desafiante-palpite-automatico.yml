name: Corrigir bolao.html - pontuação com peso

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-desafiante-palpite-automatico.yml'
      - '.github/scripts/corrigir_bolao_ia.py'

permissions:
  contents: write

jobs:
  corrigir-bolao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir bolao.html
        run: python3 .github/scripts/corrigir_bolao_ia.py

      - name: Validar correção
        run: |
          grep -q 'V058_PONTUACAO_COM_PESO_POR_RODADA' bolao.html
          grep -q 'function bolaoComPeso' bolao.html
          grep -q 'function pesoDaRodada' bolao.html
          grep -q 'function detalhePontuacaoBase' bolao.html
          grep -q 'gravarPANoFechamento' bolao.html
          test "$(grep -c 'function detalhePontuacao(p,g)' bolao.html)" -eq 1

      - name: Publicar bolao.html corrigido
        run: |
          if git diff --quiet -- bolao.html; then
            echo 'O bolao.html já está corrigido.'
            exit 0
          fi
          git config user.name 'Portal SimonSports Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bolao.html
          git commit -m 'Corrigir pontuação com peso por rodada no bolao.html'
          git push
