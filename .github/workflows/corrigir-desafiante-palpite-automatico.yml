name: Corrigir bolao.html - IA e palpite automático

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-desafiante-palpite-automatico.yml'
      - '.github/scripts/corrigir_bolao_ia.py'

permissions:
  contents: write

jobs:
  corrigir-bolao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir bolao.html
        run: python3 .github/scripts/corrigir_bolao_ia.py

      - name: Validar correção
        run: |
          grep -q 'V057_DESAFIANTE_IA_TODOS_JOGOS_PA_NO_FECHAMENTO' bolao.html
          grep -q 'gravarPANoFechamento' bolao.html
          test "$(grep -c 'function applyPAIfNeeded' bolao.html)" -eq 1

      - name: Publicar bolao.html corrigido
        run: |
          if git diff --quiet -- bolao.html; then
            echo 'O bolao.html já está corrigido.'
            exit 0
          fi
          git config user.name 'Portal SimonSports Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bolao.html
          git commit -m 'Corrigir Desafiante IA e palpite automático no fechamento'
          git push
