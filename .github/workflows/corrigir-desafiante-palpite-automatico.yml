name: Atualizar bolao.html

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/corrigir_bolao_ia.py'

concurrency:
  group: atualizar-bolao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  atualizar-bolao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Aplicar ajuste pontual no bolao.html
        run: python3 .github/scripts/corrigir_bolao_ia.py

      - name: Validar estrutura preservada
        run: |
          grep -q '<!DOCTYPE html>' bolao.html
          grep -q 'function ensureUser' bolao.html
          grep -q 'function detalhePontuacao' bolao.html
          grep -q 'function teamMiniHtml' bolao.html
          grep -q 'V063_TABELAS_CENTRALIZADAS' bolao.html
          grep -q '.info-table th,.info-table td{text-align:center}' bolao.html
          test "$(grep -c 'function totalRodadasCamp' bolao.html)" -eq 1
          test "$(grep -c 'function rodadaEstimadaPeloProgresso' bolao.html)" -eq 1

      - name: Publicar bolao.html atualizado
        run: |
          if git diff --quiet -- bolao.html; then
            echo 'O bolao.html já está atualizado.'
            exit 0
          fi
          git config user.name 'Portal SimonSports Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add bolao.html
          git commit -m 'Centralizar dados abaixo dos cabeçalhos das tabelas'
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${BRANCH}"
